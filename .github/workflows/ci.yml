name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  build:
    name: Build and Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@trevelint"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and format
        run: npm run format-and-lint

      - name: Build
        run: npm run build
        env:
          VITE_MFE_REMOTES: pages

      - name: Report build artifacts
        run: npm run report-build-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shell-dist
          path: dist/
          if-no-files-found: error

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test-coverage

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@trevelint"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Pages remotes
        run: |
          set -euo pipefail
          for url in \
            "https://trevelint.github.io/mba-mfe-product/assets/remoteEntry.js" \
            "https://trevelint.github.io/mba-mfe-buy-box/assets/remoteEntry.js" \
            "https://trevelint.github.io/mba-mfe-cart/assets/remoteEntry.js"; do
            echo "Checking ${url}"
            curl -sfI "$url"
          done

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: shell-dist
          path: dist/

      - name: Install Browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
